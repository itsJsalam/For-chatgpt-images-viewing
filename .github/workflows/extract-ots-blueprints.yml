name: Extract OTS blueprint ZIP
on:
  push:
    paths:
      - 'ots-transport-blueprints.zip'
      - '.github/workflows/extract-ots-blueprints.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract ZIP into repository
        run: |
          test -f ots-transport-blueprints.zip
          unzip -o ots-transport-blueprints.zip -d .
          git status --short
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ots transport blueprints"
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract OTS transport blueprint images"
            git push
          fi
